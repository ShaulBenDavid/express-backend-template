databases:
  - name: app-db
    plan: basic-256mb
    databaseName: app
    user: app
    region: oregon

services:
  - type: web
    name: app-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate:prod
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
